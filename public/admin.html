<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#faf6ee">
    <meta name="robots" content="noindex, nofollow">
    <title>Guest book | Avantika Group</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/vendor/gsap.min.js" defer></script>
    <script src="/admin.js" defer></script>
  </head>
  <body class="admin-page">
    <main>
      <section id="login-view" class="login-view" aria-labelledby="login-heading">
        <div class="login-mark" aria-hidden="true">A</div>
        <p class="admin-wordmark">Avantika Group</p>
        <h2 id="login-heading">A private guest book.</h2>
        <p class="login-copy">Sign in to see every welcome, across every room.</p>
        <form id="login-form" class="login-form">
          <div class="field-group">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="primary-action liquid-button" type="submit">Open the guest book</button>
          <p id="login-error" class="field-error centered" role="alert"></p>
        </form>
        <a class="back-link" href="/">Back to guest check-in</a>
      </section>

      <section id="dashboard-view" class="dashboard-view" hidden aria-labelledby="guest-book-heading">
        <header class="admin-header">
          <a class="admin-brand" href="/" aria-label="Avantika Group guest check-in">
            <span aria-hidden="true">A</span>
            <strong>Avantika Group</strong>
          </a>
          <button id="sign-out" class="text-button" type="button">Sign out</button>
        </header>

        <div class="ledger-shell">
          <div class="ledger-title-row">
            <div>
              <p class="ledger-kicker">Every room. One view.</p>
              <h1 id="guest-book-heading">Guest book</h1>
            </div>
            <div class="guest-total" aria-live="polite">
              <strong id="total-count">—</strong>
              <span>Total guests</span>
            </div>
          </div>

          <div class="ledger-toolbar">
            <div class="filter-control glass-control">
              <label for="outlet-filter">Outlet</label>
              <select id="outlet-filter">
                <option value="">All outlets</option>
                <option>Kampai</option>
                <option>Basque</option>
                <option>Embassy — Connaught Place</option>
                <option>Embassy — Elan Epic</option>
                <option>Embassy — Vasant Kunj</option>
              </select>
            </div>
            <a id="export-link" class="export-button liquid-button" href="/api/admin/export" download>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 19h14"/></svg>
              Download guest list
            </a>
          </div>

          <p id="ledger-status" class="ledger-status" role="status" aria-live="polite"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Guest</th>
                  <th scope="col">Mobile</th>
                  <th scope="col">Outlet</th>
                  <th scope="col">Arrived</th>
                </tr>
              </thead>
              <tbody id="lead-rows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
